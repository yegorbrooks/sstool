<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chargeback Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div class="wrap">
<div id="listView">
  <header class="top">
    <h1>Chargebacks</h1>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <a href="#cases" class="tab on" id="tab_cases" role="tab" aria-selected="true">Cases</a>
      <a href="#stats" class="tab" id="tab_stats" role="tab" aria-selected="false">Stats</a>
      <a href="#tools" class="tab" id="tab_tools" role="tab" aria-selected="false">Tools</a>
    </nav>
    <div class="controls">
      <button id="newBtn" class="btn primary">Add case</button>
    </div>
  </header>

  <div id="pane_cases" role="tabpanel" aria-labelledby="tab_cases">
    <div id="alertArea"></div>
    <div class="list-head">
      <h2 id="listTitle">Cases</h2>
      <div class="filters">
        <input id="search" type="search" placeholder="Search PNR, sale ID, case no." aria-label="Search cases">
      </div>
    </div>
    <div id="tableArea"></div>
  </div>

  <div id="pane_stats" role="tabpanel" aria-labelledby="tab_stats" hidden>
    <div class="controls stats-controls">
      <select id="period" class="field-sm" aria-label="Period"></select>
      <span id="customRange" class="range" hidden>
        <input type="date" id="rangeFrom" class="field-sm" aria-label="From date">
        <span class="muted">to</span>
        <input type="date" id="rangeTo" class="field-sm" aria-label="To date">
      </span>
      <select id="currency" class="field-sm" aria-label="Currency"></select>
      <button id="exportBtn" class="btn" hidden>Export CSV</button>
    </div>
    <section id="statsArea" aria-label="Statistics"></section>
  </div>

  <div id="pane_tools" role="tabpanel" aria-labelledby="tab_tools" hidden></div>
</div>

<main id="detailView" class="detail" hidden>
  <button class="btn back" id="backBtn" type="button">&larr; Back to cases</button>
  <div id="detailBody"></div>
</main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
